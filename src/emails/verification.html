<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#050609;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#050609;padding:40px 16px">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:24px;padding:40px 32px">
      <!-- Logo -->
      <tr><td align="center" style="padding-bottom:24px">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F5F6FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/></svg>
        <h1 style="color:#F5F6FA;font-size:24px;font-weight:800;margin:12px 0 0">{{appName}}</h1>
      </td></tr>
      <!-- Body -->
      <tr><td style="color:#F5F6FA;font-size:15px;line-height:1.6">
        <p style="margin:0 0 12px">Hola <strong>{{userName}}</strong>,</p>
        <p style="margin:0 0 24px;color:rgba(245,246,250,0.62)">Gracias por registrarte en {{appName}}. Solo falta un paso para activar tu cuenta.</p>
      </td></tr>
      <!-- Button -->
      <tr><td align="center" style="padding-bottom:24px">
        <a href="{{verificationUrl}}" style="display:inline-block;padding:16px 32px;background:linear-gradient(135deg,#0A84FF,#8B5CF6);color:#fff;border-radius:18px;text-decoration:none;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(10,132,255,0.35)">Verificar cuenta</a>
      </td></tr>
      <!-- Fallback -->
      <tr><td style="color:rgba(245,246,250,0.38);font-size:12px;padding-bottom:20px">
        <p style="margin:0">Si el botón no funciona, copia este enlace:</p>
        <p style="margin:4px 0 0;word-break:break-all;color:rgba(245,246,250,0.38)">{{verificationUrl}}</p>
      </td></tr>
      <!-- Divider -->
      <tr><td style="border-top:1px solid rgba(255,255,255,0.08);padding-top:20px">
        <p style="margin:0;color:rgba(245,246,250,0.38);font-size:11px;text-align:center">
          Si no creaste esta cuenta, puedes ignorar este mensaje.<br>
          © {{appName}}
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
