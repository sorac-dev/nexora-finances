# Nexora Finance — Nginx Configuration
# Place at: /etc/nginx/sites-available/nexora-finances

server {
    listen 80;
    server_name nexora.app www.nexora.app;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nexora.app www.nexora.app;

    # SSL — Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/nexora.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexora.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=login burst=5 nodelay;
        limit_req zone=api burst=30 nodelay;
    }

    # Static assets — cache for 1 year
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://127.0.0.1:3000;
    }

    # Public files
    location /icons {
        expires 30d;
        add_header Cache-Control "public";
        proxy_pass http://127.0.0.1:3000;
    }

    # Enable rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=5/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30/m;

    # Logs
    access_log /var/log/nginx/nexora-access.log;
    error_log /var/log/nginx/nexora-error.log;
}
